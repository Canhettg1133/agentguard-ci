name: AgentGuard Security Audit

on:
  pull_request:
    branches: [main, master]

jobs:
  audit:
    name: PR Security & AI Safety Guardrail
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies & Build
        run: |
          npm ci
          npm run build

      - name: Run AgentGuard-CI Action
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fail-on-severity: high
          comment-on-pr: true
          sarif-file: agentguard-report.sarif

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: agentguard-report.sarif

      - name: Run CLI Self-Audit
        run: |
          node dist/cli.js scan src/ --threshold high
